name: feather_wing_tours
description: "Feather Wing Tours — companion mobile app for the Feather Wing Tours website (trips, destinations, packages, planner, concierge)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.0
  intl: ">=0.19.0 <0.30.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
